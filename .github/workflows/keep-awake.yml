name: Keep Streamlit App Awake

on:
  schedule:
    # Every 10 minutes to reduce the chance of Streamlit Cloud sleeping.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app URL
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "STREAMLIT_APP_URL secret is not set."
            exit 1
          fi

          curl -fsS --max-time 30 "$APP_URL" > /dev/null

name: Keep Streamlit App Awake (Via Empty Commit)

on:
  schedule:
    # 每 6 小時自動推一次空白 Commit
    - cron: "0 */9 * * *"
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊測試

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push empty commit to trigger Streamlit build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 建立不影響任何程式碼的空白 Commit
          git commit --allow-empty -m "Chore: Keep-alive ping to Streamlit Cloud [skip ci]"
          
          # 自動推送到目前的分支
          git push origin HEAD
